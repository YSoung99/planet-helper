name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            lock: requirements-linux.lock
          - os: macos-latest
            lock: requirements-macos.lock
    env:
      QT_QPA_PLATFORM: offscreen
      PLANET_EXP_DATA_DIR: ${{ github.workspace }}/.ci-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: ${{ matrix.lock }}
      - name: System libraries for Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0 xvfb
      - name: Install dependencies
        run: python -m pip install -r ${{ matrix.lock }}
      - name: Import both apps
        run: python -c "import importlib, sys, qt_controller, tracker, record_history; importlib.import_module('linux_app' if sys.platform.startswith('linux') else 'mac_app')"
      - name: Run tests
        # Screen-capture tests need an X display; Linux runners get a virtual one.
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a python -m unittest discover -s tests -v
          else
            python -m unittest discover -s tests -v
          fi
