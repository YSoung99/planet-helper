name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            lock: requirements-linux.lock
          - os: macos-latest
            lock: requirements-macos.lock
    env:
      QT_QPA_PLATFORM: offscreen
      PLANET_EXP_DATA_DIR: ${{ github.workspace }}/.ci-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: ${{ matrix.lock }}
      - name: System libraries for Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0 xvfb
      - name: Install dependencies
        run: python -m pip install -r ${{ matrix.lock }}
      - name: Import both apps
        run: python -c "import importlib, sys, qt_controller, tracker, record_history; importlib.import_module('linux_app' if sys.platform.startswith('linux') else 'mac_app')"
      - name: Run tests
        # Screen-capture tests need an X display; Linux runners get a virtual one.
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a python -m unittest discover -s tests -v
          else
            python -m unittest discover -s tests -v
          fi
      - name: Verify Linux installation and version switch
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          git archive HEAD | tar -x -C "$root"
          python -m venv --system-site-packages "$root/.venv"
          HOME="$root/test-home" "$root/install-linux.sh"
          app="$root/.planet-helper-versions/v1.4.5-smoke"
          mkdir -p "$app"
          git archive HEAD | tar -x -C "$app"
          python -m venv --system-site-packages "$app/.venv"
          "$app/install-linux.sh" --prepare
          marker="$root/settings.json"
          printf '{"compact":true}\n' > "$marker"
          HOME="$root/test-home" "$root/test-home/.local/bin/planet-helper" &
          parent=$!
          trap 'kill "$parent" 2>/dev/null || true' EXIT
          for attempt in {1..50}; do
            if test -s "$root/.app.lock"; then break; fi
            sleep .2
          done
          test -s "$root/.app.lock"
          kill -0 "$parent"
          kill -KILL "$parent"
          wait "$parent" || true
          trap - EXIT
          python - "$root" <<'PYTEST'
          from pathlib import Path
          import sys
          import linux_updates as updates
          root = Path(sys.argv[1])
          updates.switch(root, '.', 'v1.4.5-smoke')
          assert updates.state(root) == {'current': 'v1.4.5-smoke', 'previous': '.'}
          updates.switch(root, 'v1.4.5-smoke', '.')
          assert updates.state(root) == {'current': '.', 'previous': 'v1.4.5-smoke'}
          assert (root / 'settings.json').is_file()
          PYTEST
